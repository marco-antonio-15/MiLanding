<header class="site-header" [class.scrolled]="scrolled" role="navigation" aria-label="Main Navigation">
  <div class="container header-inner">
    <div class="brand">
      <a routerLink="/" class="logo" (click)="closeMenu()" aria-label="Ir al inicio">
        <!-- <img src="assets/logo.svg" alt="Logo"> -->
        <span class="logo-mark">MA</span>
        <span class="logo-text">Marco Antonio Luna Salas</span>
      </a>
    </div>

    <!-- Desktop nav -->
    <nav class="nav-desktop" [attr.aria-hidden]="isMobileMenuOpen ? 'true' : 'false'">
      <a routerLink="/" routerLinkActive="active" (click)="closeMenu()">Inicio</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">Sobre mí</a>
      <a routerLink="/skills" routerLinkActive="active" (click)="closeMenu()">Habilidades</a>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Proyectos</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a>
    </nav>

    <!-- Right area: avatar + mobile toggle -->
    <div class="right-controls">
      <!-- Avatar (coloca tu foto en assets/avatar.jpg) -->
      <a routerLink="/about" class="avatar-link" (click)="closeMenu()" aria-label="Ver mi perfil">
        <img src="assets/pic.jpg" alt="Foto de Marco Antonio" class="avatar" />
      </a>

      <!-- Mobile hamburger -->
      <button class="mobile-toggle" [attr.aria-expanded]="isMobileMenuOpen" aria-label="Abrir menú" (click)="toggleMenu()">
        <span class="hamburger" [class.open]="isMobileMenuOpen"></span>
      </button>
    </div>
  </div>

  <!-- Mobile nav (overlay) -->
  <div class="mobile-nav" [class.open]="isMobileMenuOpen" role="menu" [attr.aria-hidden]="isMobileMenuOpen ? 'false' : 'true'">
    <nav aria-label="mobile-nav-label">
      <a routerLink="/" routerLinkActive="active" (click)="closeMenu()">Inicio</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">Sobre mí</a>
      <a routerLink="/skills" routerLinkActive="active" (click)="closeMenu()">Habilidades</a>
      <a routerLink="/projects" routerLinkActive="active" (click)="closeMenu()">Proyectos</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a>
    </nav>
  </div>
</header>
