<article class="card">
  <div class="card-top">
    <span class="category" *ngIf="project.category">{{ project.category }}</span>
  </div>
  <h3 class="title">{{ project.title }}</h3>
  <p class="short">{{ project.short }}</p>
  <p class="stack">{{ project.stack.join(' · ') }}</p>

  <div class="actions">
    <a *ngIf="project.linkDemo" [href]="project.linkDemo" target="_blank" rel="noopener">Ver demo ↗</a>
    <a *ngIf="project.linkRepo" [href]="project.linkRepo" target="_blank" rel="noopener">Repositorio ↗</a>
    <a [routerLink]="['/projects', project.id]" class="details">Ver detalles →</a>
  </div>
</article>
