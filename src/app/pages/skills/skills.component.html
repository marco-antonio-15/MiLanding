<section class="skills-page">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Mi stack tecnológico</span>
      <h2>Habilidades y experiencia</h2>
      <p>Tecnologías y herramientas con las que trabajo para crear soluciones.</p>
    </div>

    <div class="skills-grid">
      <div class="category" *ngFor="let group of skills">
        <div class="category-header">
          <h3>{{ group.category }}</h3>
          <span class="count">{{ group.items.length }}</span>
        </div>
        <div class="pills">
          <app-skill-pill *ngFor="let sk of group.items" [label]="sk"></app-skill-pill>
        </div>
      </div>
    </div>

    <div class="summary">
      <div><strong>15+</strong><span>Tecnologías</span></div>
      <div><strong>6+</strong><span>Años de experiencia</span></div>
      <div><strong>50+</strong><span>Proyectos completados</span></div>
    </div>
  </div>
</section>
