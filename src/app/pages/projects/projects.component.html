<section class="projects container">
    <h2>Proyectos destacados</h2>

    <div class="controls">
        <input type="search" placeholder="Filtrar por stack o nombre" [(ngModel)]="filter" />

        <select [(ngModel)]="selectedCategory" (ngModelChange)="selectedCategory">
            <option value="">Todas las categorías</option>
            <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>

        <button (click)="clearFilters()">Limpiar</button>
    </div>

    <div class="grid">
        <ng-container *ngIf="filteredProjects$ | async as projects">
            <app-project-card *ngFor="let p of projects" [project]="p"></app-project-card>
            <p *ngIf="projects.length === 0">No se encontraron proyectos.</p>
        </ng-container>
    </div>
</section>
