<section class="projects-page">
  <div class="container">
    <div class="section-head">
      <span class="eyebrow">Portafolio</span>
      <h2>Proyectos</h2>
      <p>Proyectos en los que he trabajado, con su stack y su detalle.</p>
    </div>

    <!-- Filtros -->
    <div class="controls">
      <input
        type="search"
        placeholder="Buscar por nombre, stack o tecnología…"
        [(ngModel)]="filter"
        aria-label="Buscar proyectos"
      />

      <select [(ngModel)]="selectedCategoryValue" aria-label="Filtrar por categoría">
        <option value="">Todas las categorías</option>
        <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
      </select>

      <button type="button" class="btn btn-outline" (click)="clearFilters()" [disabled]="!(filter || selectedCategoryValue)">
        Limpiar filtros
      </button>
    </div>

    <!-- Listado -->
    <div class="grid">
      <ng-container *ngIf="filteredProjects$ | async as projects">
        <app-project-card *ngFor="let p of projects; trackBy: trackByProjectId" [project]="p"></app-project-card>

        <p *ngIf="projects.length === 0" class="no-results">
          No se encontraron proyectos con los filtros aplicados. Intenta con otros términos.
        </p>
      </ng-container>
    </div>
  </div>
</section>
