<section class="contact-page">
  <div class="container">
    <div class="intro">
      <span class="eyebrow">Contacto</span>
      <h2>{{ personalInfo.tagline }}</h2>
      <p>{{ personalInfo.availability }}. Puedes escribirme por cualquiera de estos medios.</p>
    </div>

    <div class="methods">
      <article class="method" *ngFor="let method of contactMethods; trackBy: trackById" [attr.data-contact-type]="method.id">
        <h3>{{ method.label }}</h3>
        <p class="desc">{{ method.description }}</p>
        <p class="value">{{ method.value }}</p>

        <div class="method-actions">
          <a [href]="method.link" target="_blank" rel="noopener noreferrer" class="btn btn-primary" [attr.aria-label]="'Contactar por ' + method.label">Abrir</a>
          <button type="button" class="btn btn-outline" (click)="copyToClipboard(method.value, method.label)" [attr.aria-label]="'Copiar ' + method.label">Copiar</button>
        </div>
      </article>
    </div>

    <p class="toast" *ngIf="copiedLabel" role="status" aria-live="polite">{{ copiedLabel }} copiado al portapapeles.</p>

    <div class="social">
      <h3>Encuéntrame en</h3>
      <div class="social-links">
        <a *ngFor="let social of socialLinks; trackBy: trackById" [href]="social.url" target="_blank" rel="noopener noreferrer" [attr.data-social]="social.id">
          {{ social.name }} ↗
        </a>
      </div>
    </div>
  </div>
</section>
